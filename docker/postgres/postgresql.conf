# CEOF TALENT — PostgreSQL 17
# Ajustes conservadores para um servidor com ~2 GB de RAM dedicados ao banco.
# Recalcule shared_buffers/effective_cache_size conforme o hardware em produção.

listen_addresses = '*'          # acessível somente pela rede Docker interna
port = 5432
max_connections = 100
password_encryption = scram-sha-256

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

random_page_cost = 1.1
effective_io_concurrency = 200

# Logs no stderr (coletados pelo Docker: docker compose logs database)
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 500ms
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '

timezone = 'America/Manaus'
log_timezone = 'America/Manaus'
datestyle = 'iso, dmy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.portuguese'
