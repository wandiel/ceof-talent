# CEOF TALENT — Redis 7.4 (cache, sessões e filas)
# A senha é definida via --requirepass no Compose (variável REDIS_PASSWORD).

bind 0.0.0.0
protected-mode yes
port 6379

# Persistência: as filas não podem se perder em uma reinicialização.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
dir /data

maxmemory 256mb
# noeviction: nunca descarta jobs de fila silenciosamente quando a memória acaba.
maxmemory-policy noeviction

# Desabilita comandos perigosos para a aplicação.
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

loglevel notice
logfile ""
