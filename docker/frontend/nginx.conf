# CEOF TALENT — Nginx interno do container "frontend" (somente arquivos estáticos)
# Não é exposto diretamente: recebe tráfego apenas do Nginx de borda.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log off;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

        # Arquivos com hash no nome: cache longo e imutável.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA: rotas do Vue Router caem no index.html, que nunca é cacheado.
        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}
