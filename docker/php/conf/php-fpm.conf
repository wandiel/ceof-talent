; CEOF TALENT — configuração global do PHP-FPM (executado como www-data, sem root)
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
log_level = notice
log_limit = 8192
daemonize = no
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 20s

include = /etc/php/8.3/fpm/pool.d/*.conf
