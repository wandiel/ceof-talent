; CEOF TALENT — ajustes de PHP aplicados a CLI e FPM
; Valores sensíveis a ambiente são sobrescritos via variáveis no php-fpm (www.conf).

[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
post_max_size = 25M
upload_max_filesize = 20M
max_file_uploads = 10
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

[Date]
date.timezone = America/Manaus

[Session]
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Em desenvolvimento o código muda: valida timestamps. Em produção a imagem é imutável.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
opcache.jit = off

[realpath]
realpath_cache_size = 4096K
realpath_cache_ttl = 600
