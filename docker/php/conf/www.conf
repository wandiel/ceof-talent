; CEOF TALENT — pool PHP-FPM
[www]
; Escuta em todas as interfaces da rede Docker interna. A porta 9000 nunca é
; publicada no host: somente o Nginx acessa o FPM pelo nome do serviço "app".
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; Endpoints internos usados pelo healthcheck (cgi-fcgi), não roteados pelo Nginx.
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

request_terminate_timeout = 120s
security.limit_extensions = .php
