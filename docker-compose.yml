# =============================================================================
# CEOF TALENT — ambiente de DESENVOLVIMENTO
#
#   cp .env.example .env      # opcional: há valores padrão seguros para dev
#   docker compose up -d --build
#   http://localhost:8080
#
# Produção: docker-compose.prod.yml (ver docs/02-infraestrutura-docker.md)
# =============================================================================
name: ceof-talent

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-CEOF TALENT}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Manaus}
  APP_LOCALE: ${APP_LOCALE:-pt_BR}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: pgsql
  DB_HOST: database
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-ceof_talent}
  DB_USERNAME: ${DB_USERNAME:-ceof_talent}
  DB_PASSWORD: ${DB_PASSWORD:-ceof_talent_dev}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-ceof_redis_dev}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  # Origens do SPA que recebem sessão por cookie (Sanctum).
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:${APP_PORT:-8080},127.0.0.1:${APP_PORT:-8080},localhost,127.0.0.1}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-nao-responda@ceoftalent.local}
  MAIL_FROM_NAME: ${APP_NAME:-CEOF TALENT}
  # Aviso de privacidade do portal (LGPD)
  PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-2026.1}
  PRIVACY_NOTICE_UPDATED_AT: ${PRIVACY_NOTICE_UPDATED_AT:-2026-11-27}
  PRIVACY_CONTROLLER: ${PRIVACY_CONTROLLER:-Hospital de Olhos CEOF}
  PRIVACY_DPO_NAME: ${PRIVACY_DPO_NAME:-}
  PRIVACY_DPO_EMAIL: ${PRIVACY_DPO_EMAIL:-}
  PRIVACY_TALENT_POOL_MONTHS: ${PRIVACY_TALENT_POOL_MONTHS:-24}
  PRIVACY_NO_CONSENT_MONTHS: ${PRIVACY_NO_CONSENT_MONTHS:-6}
  PRIVACY_DELETED_GRACE_DAYS: ${PRIVACY_DELETED_GRACE_DAYS:-30}
  PRIVACY_KEEP_HIRED: ${PRIVACY_KEEP_HIRED:-true}
  PRIVACY_AUDIT_MONTHS: ${PRIVACY_AUDIT_MONTHS:-60}
  PRIVACY_RETENTION_ENABLED: ${PRIVACY_RETENTION_ENABLED:-true}
  CEP_LOOKUP_ENABLED: ${CEP_LOOKUP_ENABLED:-true}

x-backend-build: &backend-build
  context: .
  dockerfile: docker/php/Dockerfile
  target: dev
  args:
    UID: ${HOST_UID:-1000}
    GID: ${HOST_GID:-1000}

services:
  app:
    build: *backend-build
    image: ceof-talent/backend:dev
    command: ["app"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      SEED_REFERENCE_DATA: ${SEED_REFERENCE_DATA:-true}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "ceof-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Na primeira subida o composer install roda na pasta do projeto; em Windows
      # (pasta compartilhada com o Docker Desktop) isso pode levar vários minutos.
      start_period: 900s
    restart: unless-stopped
    networks: [internal, edge]

  queue:
    image: ceof-talent/backend:dev
    command: ["queue"]
    environment: *backend-env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "ceof-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [internal]

  scheduler:
    image: ceof-talent/backend:dev
    command: ["scheduler"]
    environment: *backend-env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "ceof-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    image: ceof-talent/frontend:dev
    environment:
      VITE_HMR_CLIENT_PORT: ${APP_PORT:-8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks: [edge]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ceof-talent/nginx:dev
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/templates/dev:/etc/nginx/templates:ro
    depends_on:
      app: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [edge, internal]

  database:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ceof_postgres_dev}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      APP_DB_NAME: ${DB_DATABASE:-ceof_talent}
      APP_DB_USER: ${DB_USERNAME:-ceof_talent}
      APP_DB_PASSWORD: ${DB_PASSWORD:-ceof_talent_dev}
      TZ: ${APP_TIMEZONE:-America/Manaus}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Exposto apenas em 127.0.0.1 para ferramentas locais (DBeaver, psql).
    # Em produção esta porta NÃO é publicada.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7.4.12-alpine
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ceof_redis_dev}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: ceof-talent/backup:dev
    environment: &backup-env
      PGHOST: database
      PGDATABASE: ${DB_DATABASE:-ceof_talent}
      PGUSER: ${DB_USERNAME:-ceof_talent}
      PGPASSWORD: ${DB_PASSWORD:-ceof_talent_dev}
      TZ: ${APP_TIMEZONE:-America/Manaus}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Documentos em bucket (mesmas variáveis da aplicação)
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      # Cópia externa dos backups (S3 ou compatível); vazio = desativada
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-ceof-talent}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-false}
      BACKUP_S3_RETENTION_DAYS: ${BACKUP_S3_RETENTION_DAYS:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./backend/storage/app:/data/storage:ro
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f backup-scheduler >/dev/null || pgrep -f 'tail -f /dev/null' >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [internal]

  # Ferramenta sob demanda (não sobe com "up"). Uso:
  #   docker compose stop app queue scheduler
  #   docker compose run --rm restore latest --yes
  #   docker compose start app queue scheduler
  restore:
    image: ceof-talent/backup:dev
    profiles: ["tools"]
    entrypoint: ["restore"]
    environment:
      <<: *backup-env
      STORAGE_OWNER: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
      - ./backend/storage/app:/data/storage
    depends_on:
      database: { condition: service_healthy }
    networks: [internal]

  # Testes de interface (Fase 11). Sob demanda, não sobe com "up". Uso:
  #   docker compose --profile tests run --rm e2e
  # Cria dados próprios (prefixo "E2E"); use em desenvolvimento ou homologação.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["tests"]
    working_dir: /e2e
    environment:
      APP_PORT: ${APP_PORT:-8080}
      E2E_BASE_URL: http://localhost:${APP_PORT:-8080}
      E2E_EMAIL: ${E2E_EMAIL:-admin@ceof.test}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      CI: "1"
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && (node proxy.mjs &) && sleep 1 && npx playwright test \"$$@\"", "--"]
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      nginx: { condition: service_healthy }
    networks: [edge]

networks:
  # edge: tráfego HTTP (nginx <-> frontend/app)
  edge: {}
  # internal: banco, cache e filas. Em produção é "internal: true" (sem saída
  # para a internet). Em dev fica normal para permitir o acesso local ao banco.
  internal: {}

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  e2e_node_modules:
